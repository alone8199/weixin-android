name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /opt/android-sdk
  ANDROID_SDK_ROOT: /opt/android-sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: 'stable'
          cache: true

      - name: Install Android SDK (cmdline-tools)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y unzip wget
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmd.zip
          unzip -q /tmp/cmd.zip -d /tmp/ct
          mv /tmp/ct/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses
          sdkmanager --sdk_root=$ANDROID_HOME \
            "platform-tools" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "platforms;android-34" \
            "platforms;android-35" \
            "platforms;android-36"

      - name: Back up customized AndroidManifest
        run: cp android/app/src/main/AndroidManifest.xml /tmp/manifest.bak

      - name: Regenerate Flutter native files (correct Gradle / AGP versions)
        run: flutter create .

      - name: Restore customized AndroidManifest (INTERNET + cleartext traffic)
        run: cp /tmp/manifest.bak android/app/src/main/AndroidManifest.xml

      - name: Bump compileSdk/targetSdk to 36
        # image_picker / file_picker 引入的 flutter_plugin_android_lifecycle 要求 compileSdk >= 36；
        # 插件子工程默认按 34 编译，故强制所有 Android 子工程（含插件）使用 compileSdk 36。
        run: |
          F=android/app/build.gradle.kts
          [ -f android/app/build.gradle ] && F=android/app/build.gradle
          sed -i -E 's/^( *)compileSdk = .*/\1compileSdk = 36/; s/^( *)targetSdk = .*/\1targetSdk = 36/' "$F"
          printf '\n' >> "$F"
          printf 'afterEvaluate {\n' >> "$F"
          printf '    rootProject.subprojects.forEach { p ->\n' >> "$F"
          printf '        val a = p.extensions.findByName("android")\n' >> "$F"
          printf '        if (a != null) {\n' >> "$F"
          printf '            (a as com.android.build.gradle.BaseExtension).compileSdkVersion = 36\n' >> "$F"
          printf '        }\n' >> "$F"
          printf '    }\n' >> "$F"
          printf '}\n' >> "$F"
          echo "---- $F ----"; grep -n "compileSdk\|targetSdk\|compileSdkVersion" "$F" | head

      - name: Ensure gradlew is executable
        run: chmod +x android/gradlew

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
