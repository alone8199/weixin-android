name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: 'stable'
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Back up customized AndroidManifest
        run: cp android/app/src/main/AndroidManifest.xml /tmp/manifest.bak

      - name: Regenerate Flutter native files (correct Gradle / AGP versions)
        run: flutter create .

      - name: Restore customized AndroidManifest (INTERNET + cleartext traffic)
        run: cp /tmp/manifest.bak android/app/src/main/AndroidManifest.xml

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
